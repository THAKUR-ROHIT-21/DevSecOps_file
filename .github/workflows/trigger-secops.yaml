name: Step 1- verify Application push Trigger

on:
  push:
    branches:
      - main

jobs:
  verify-push-trigger:
    name: verify Applicatio push Trigger
    runs-on: ubuntu-latest

    steps:
      - name: Confirmation
        run: |
          echo "Application repository push"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"


      - name: Trigger SecOps Repository
        env:
          SECOPS_TRIGGER_TOKEN: ${{ secrets.SECOPS_TRIGGER_TOKEN }}
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $SECOPS_TRIGGER_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
             https://api.github.com/repos/THAKUR-ROHIT-21/SecOps/dispatches \
            -d '{
              "event_type":"application_push",
                "client_payload":{
                "repository":"${{ github.repository }}",
                "branch":"${{ github.ref_name }}",
                "commit_sha":"${{ github.sha }}"

                  }
               }'
      - name: Checkout Exact Application Commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.commit_sha }}
          path: application

      - name: Verify Checked Out Commit
        working-directory: application
        run: |
          echo "Application Source Successfully Checked Out"
          echo "Checked Out Commit SHA:"
          git rev-parse HEAD

      - name: Scan For Secret Application 
        run: |
          docker run --rm \
          -v "$PWD/application:/repo" \
          zricethezav/gitleaks:latest \
          detect --source=/repo --verbose --redact